[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldnotes-gallery"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi==0.162.0", "starlette==1.10.0", "uvicorn==0.40.0", "numpy==2.2.6", "pillow==12.0.0", "pillow-heif==1.8.1", "qrcode[pil]==8.2", "argon2-cffi==25.1.0", "httpx==0.28.1"]

[project.optional-dependencies]
model = ["torch==2.6.0", "torchvision==0.21.0", "transformers==5.1.0", "peft==0.21.2", "accelerate==1.12.0", "sentencepiece", "protobuf"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "zxing-cpp>=2,<4"]

[project.scripts]
fieldnotes = "gallery.cli:main"

[tool.setuptools.packages.find]
include = ["gallery*"]

[tool.setuptools.package-data]
gallery = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
